name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }   # README minimum
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }   # the platform the listing says is tested
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: guard
        run: python3 -I hooks/guard_tests.py
      - name: hooks
        run: python3 -I tests/hooks_test.py
      - name: claims
        run: python3 -I tests/claims_test.py
      - name: upgrade
        run: bash tests/upgrade_test.sh
      - name: build free zip
        run: python3 -I release/build_free.py "$RUNNER_TEMP/autosave.zip"
